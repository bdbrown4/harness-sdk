name: ".NET: PortAudio Windows assets"
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      windows-runner:
        type: string
        default: strands-agents_windows-latest_4-core
permissions:
  contents: read
jobs:
  native:
    name: Static-CRT PortAudio win-x86 and win-x64
    runs-on: ${{ inputs.windows-runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: strands-dotnet
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Build the pinned Windows assets without opening devices
        run: |
          New-Item -ItemType Directory -Path artifacts/portaudio-logs -Force | Out-Null
          foreach ($architecture in @('x86', 'x64')) {
            & ./src/Strands.Agents.Bidi.Audio/native/Build-PortAudioWindows.ps1 -Architecture $architecture -WorkingDirectory (Join-Path $env:RUNNER_TEMP "strands-portaudio-$architecture") -OutputDirectory artifacts/portaudio-native *> "artifacts/portaudio-logs/build-win-$architecture.log"
            if ($LASTEXITCODE -ne 0) { throw "PortAudio $architecture build failed." }
            Get-Content "artifacts/portaudio-logs/build-win-$architecture.log"
          }
      - name: Share both genuine Windows assets and source/license provenance
        uses: actions/upload-artifact@v7.0.1
        with:
          name: portaudio-native-windows
          path: strands-dotnet/artifacts/portaudio-native/
          retention-days: 7
          if-no-files-found: error
      - name: Retain native build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: portaudio-build-diagnostics
          path: strands-dotnet/artifacts/portaudio-logs/
          retention-days: 7
          if-no-files-found: warn
