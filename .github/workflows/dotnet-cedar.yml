name: ".NET: Native Cedar"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      native-only:
        type: boolean
        default: false
      windows-runner:
        type: string
        default: strands-agents_windows-latest_4-core
      linux-runner:
        type: string
        default: strands-agents_ubuntu-latest_4-core

permissions:
  contents: read

jobs:
  native:
    name: Cedar native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: '${{ inputs.windows-runner }}', rid: win-x86, target: i686-pc-windows-msvc, architecture: X86 }
          - { os: '${{ inputs.windows-runner }}', rid: win-x64, target: x86_64-pc-windows-msvc, architecture: X64 }
          - { os: '${{ inputs.linux-runner }}', rid: linux-x64, target: x86_64-unknown-linux-gnu, architecture: X64 }
          - { os: macos-15-intel, rid: osx-x64, target: x86_64-apple-darwin, architecture: X64 }
          - { os: macos-latest, rid: osx-arm64, target: aarch64-apple-darwin, architecture: Arm64 }
    defaults:
      run:
        shell: pwsh
        working-directory: strands-dotnet
    env:
      STRANDS_CEDAR_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install pinned native toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --target ${{ matrix.target }} --no-self-update
      - name: Build and test native libraries
        if: matrix.rid != 'linux-x64'
        run: |
          New-Item -ItemType Directory -Path artifacts/cedar-logs -Force | Out-Null
          & ./src/Strands.Agents.Cedar/native/Build-Native.ps1 -RuntimeIdentifier '${{ matrix.rid }}' *> artifacts/cedar-logs/native-${{ matrix.rid }}.log
          if ($LASTEXITCODE -ne 0) { throw 'Native Cedar build failed.' }
          Get-Content artifacts/cedar-logs/native-${{ matrix.rid }}.log
      - name: Build Linux libraries on glibc 2.31
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          mkdir -p artifacts/cedar-native artifacts/cedar-build artifacts/cedar-logs
          docker build --file src/Strands.Agents.Cedar/native/Dockerfile.linux --tag strands-cedar-linux src/Strands.Agents.Cedar/native 2>&1 | tee artifacts/cedar-logs/linux-image.log
          docker run --rm --user "$(id -u):$(id -g)" --env CARGO_HOME=/tmp/cedar-cargo --volume "$GITHUB_WORKSPACE:/repo" --workdir /repo/strands-dotnet/src/Strands.Agents.Cedar/native strands-cedar-linux bash Build-Linux.sh /repo/strands-dotnet/artifacts/cedar-native /repo/strands-dotnet/artifacts/cedar-build 2>&1 | tee artifacts/cedar-logs/native-linux-x64.log
      - name: Export original native dependency licenses
        if: matrix.rid == 'linux-x64'
        run: ./src/Strands.Agents.Cedar/native/Export-Licenses.ps1 -OutputDirectory artifacts/cedar-native/licenses
      - name: Record runtime versions
        run: dotnet --info
      - name: Managed tests on both modern runtimes
        if: matrix.rid != 'win-x86'
        run: |
          foreach ($tfm in @('net8.0', 'net10.0')) {
            dotnet test tests/Strands.Cedar.Tests/Strands.Cedar.Tests.csproj -c Release -f $tfm --logger 'console;verbosity=normal' --logger trx --results-directory "artifacts/cedar-test-results/$tfm" --blame-hang-timeout 120s --blame-hang-dump-type mini
            if ($LASTEXITCODE -ne 0) { throw "Cedar managed tests failed for $tfm." }
            ./src/Strands.Agents.Cedar/native/Assert-TestResults.ps1 -ResultsDirectory "artifacts/cedar-test-results/$tfm" -ExpectedArchitecture '${{ matrix.architecture }}'
            $trx = Get-ChildItem -LiteralPath "artifacts/cedar-test-results/$tfm" -Filter '*.trx' -File | Select-Object -First 1
            ./src/Strands.Agents.Cedar/native/Test-ResultGuard.ps1 -TrxPath $trx.FullName -ExpectedArchitecture '${{ matrix.architecture }}'
          }
      - name: Framework tests in the requested process architecture
        if: runner.os == 'Windows'
        run: |
          dotnet test tests/Strands.Cedar.Tests/Strands.Cedar.Tests.csproj -c Release -f net48 --logger 'console;verbosity=normal' --logger trx --results-directory artifacts/cedar-test-results/net48 --blame-hang-timeout 120s --blame-hang-dump-type mini -- RunConfiguration.TargetPlatform=${{ matrix.architecture }}
          if ($LASTEXITCODE -ne 0) { throw 'Cedar Framework tests failed.' }
          ./src/Strands.Agents.Cedar/native/Assert-TestResults.ps1 -ResultsDirectory artifacts/cedar-test-results/net48 -ExpectedArchitecture '${{ matrix.architecture }}'
          $trx = Get-ChildItem -LiteralPath artifacts/cedar-test-results/net48 -Filter '*.trx' -File | Select-Object -First 1
          ./src/Strands.Agents.Cedar/native/Test-ResultGuard.ps1 -TrxPath $trx.FullName -ExpectedArchitecture '${{ matrix.architecture }}'
      - name: Upload native RID asset and original licenses
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cedar-native-${{ matrix.rid }}
          path: strands-dotnet/artifacts/cedar-native/
          retention-days: 7
          if-no-files-found: error
      - name: Retain logs, tests, and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cedar-diagnostics-${{ matrix.rid }}
          path: |
            strands-dotnet/artifacts/cedar-logs/
            strands-dotnet/artifacts/cedar-test-results/
          retention-days: 7
          if-no-files-found: warn

  package:
    name: Cedar complete package
    needs: native
    if: ${{ !inputs.native-only }}
    runs-on: ${{ inputs.linux-runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: strands-dotnet
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: cedar-native-*
          path: strands-dotnet/artifacts/cedar-native
          merge-multiple: true
      - name: Build all managed package assets
        run: dotnet build src/Strands.Agents.Cedar/Strands.Agents.Cedar.csproj -c Release
      - name: Verify managed formatting
        run: |
          dotnet restore tests/Strands.Cedar.Tests/Strands.Cedar.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Cedar test-project restore failed.' }
          dotnet format src/Strands.Agents.Cedar/Strands.Agents.Cedar.csproj --no-restore --verify-no-changes --verbosity diagnostic
          if ($LASTEXITCODE -ne 0) { throw 'Cedar package formatting failed.' }
          dotnet format tests/Strands.Cedar.Tests/Strands.Cedar.Tests.csproj --no-restore --verify-no-changes --verbosity diagnostic
          if ($LASTEXITCODE -ne 0) { throw 'Cedar test formatting failed.' }
      - name: Pack and validate public APIs across target frameworks
        run: |
          dotnet pack src/Strands.Agents/Strands.Agents.csproj -c Release -o artifacts/cedar-packages
          if ($LASTEXITCODE -ne 0) { throw 'Core package validation failed.' }
          dotnet pack src/Strands.Agents.Cedar/Strands.Agents.Cedar.csproj -c Release --no-build -o artifacts/cedar-packages
          if ($LASTEXITCODE -ne 0) { throw 'Cedar package validation failed.' }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cedar-validated-packages
          path: strands-dotnet/artifacts/cedar-packages/
          retention-days: 7
          if-no-files-found: error

  consume:
    name: Cedar package consumer (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ['${{ inputs.windows-runner }}', '${{ inputs.linux-runner }}', macos-15-intel, macos-latest]
    defaults:
      run:
        shell: pwsh
        working-directory: strands-dotnet
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cedar-validated-packages
          path: strands-dotnet/artifacts/cedar-packages
      - name: Consume only published package assets with a fresh cache
        run: |
          New-Item -ItemType Directory -Path artifacts/cedar-logs -Force | Out-Null
          ./src/Strands.Agents.Cedar/native/Test-Package.ps1 -PackageDirectory artifacts/cedar-packages *> artifacts/cedar-logs/package-consumer.log
          if ($LASTEXITCODE -ne 0) { throw 'Independent Cedar package consumption failed.' }
          Get-Content artifacts/cedar-logs/package-consumer.log
      - name: Retain consumer diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cedar-consumer-${{ matrix.os }}
          path: strands-dotnet/artifacts/cedar-logs/
          retention-days: 7
          if-no-files-found: warn

  framework48:
    name: Cedar clean Framework 4.8 (x86 and x64)
    needs: package
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: cedar-native-*
          path: strands-dotnet/artifacts/cedar-native
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cedar-validated-packages
          path: strands-dotnet/artifacts/cedar-packages
      - name: Build Framework tests and independent package consumers
        working-directory: strands-dotnet
        run: |
          dotnet build tests/Strands.Cedar.Tests/Strands.Cedar.Tests.csproj -c Release -f net48
          if ($LASTEXITCODE -ne 0) { throw 'Cedar Framework test build failed.' }
          ./src/Strands.Agents.Cedar/native/Test-Package.ps1 -PackageDirectory artifacts/cedar-packages -ScratchDirectory (Join-Path $env:RUNNER_TEMP 'cedar-framework-consumer')
      - name: Prepare clean Framework runtime
        run: |
          New-Item -ItemType Directory -Path artifacts/cedar-framework48 -Force | Out-Null
          git rev-parse HEAD | Set-Content artifacts/cedar-framework48/commit.log
          docker version | Tee-Object -FilePath artifacts/cedar-framework48/docker-version.log
          if ($LASTEXITCODE -ne 0) { throw 'Docker is unavailable.' }
          nuget install Microsoft.TestPlatform -Version 17.14.1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'cedar-test-platform') -NonInteractive -DirectDownload
          if ($LASTEXITCODE -ne 0) { throw 'Cedar VSTest preparation failed.' }
          docker pull mcr.microsoft.com/windows/servercore:ltsc2022
          if ($LASTEXITCODE -ne 0) { throw 'Clean Framework image pull failed.' }
          docker image inspect mcr.microsoft.com/windows/servercore:ltsc2022 | Set-Content artifacts/cedar-framework48/image.json
      - name: Execute genuine Cedar tests and package consumers on clean 4.8
        run: |
          foreach ($platform in @('x64', 'x86')) {
            $consumer = if ($platform -eq 'x64') { 'C:\consumer\consumer\bin\Release\net48\Consumer.exe' } else { 'C:\consumer\framework-x86\Consumer.exe' }
            docker run --rm --isolation=process `
              --mount "type=bind,source=$env:GITHUB_WORKSPACE,target=C:\source,readonly" `
              --mount "type=bind,source=$env:RUNNER_TEMP\cedar-test-platform,target=C:\test-platform,readonly" `
              --mount "type=bind,source=$env:RUNNER_TEMP\cedar-framework-consumer,target=C:\consumer,readonly" `
              --mount "type=bind,source=$env:GITHUB_WORKSPACE\artifacts\cedar-framework48,target=C:\evidence" `
              mcr.microsoft.com/windows/servercore:ltsc2022 powershell -NoProfile -ExecutionPolicy Bypass `
              -File C:\source\strands-dotnet\scripts\Test-CedarFramework48.ps1 `
              -TestAssembly C:\source\strands-dotnet\tests\Strands.Cedar.Tests\bin\Release\net48\Strands.Cedar.Tests.dll `
              -VSTestConsole C:\test-platform\Microsoft.TestPlatform.17.14.1\tools\net462\Common7\IDE\Extensions\TestPlatform\vstest.console.exe `
              -TestResultValidator C:\source\strands-dotnet\src\Strands.Agents.Cedar\native\Assert-TestResults.ps1 `
              -ConsumerExecutable $consumer -Platform $platform -ResultsDirectory "C:\evidence\$platform"
            if ($LASTEXITCODE -ne 0) { throw "Cedar clean Framework $platform verification failed." }
          }
      - name: Retain clean Framework runtime and test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cedar-clean-framework48-evidence
          path: artifacts/cedar-framework48/
          retention-days: 7
          if-no-files-found: error
