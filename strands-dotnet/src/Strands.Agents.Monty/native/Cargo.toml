[package]
name = "strands-monty-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[[bin]]
name = "strands_monty_worker"
path = "src/main.rs"

[dependencies]
monty = "=0.0.23"
monty-types = "=0.0.23"
monty-alloc = { version = "=0.0.23", features = ["exit-code"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
num-bigint = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
